name: sgit_studio_flutter
description: "SGiT Studio (Flutter) — 全端(Web/桌面/移动)客户端，内核是 sgcode，经 FFI/WASM 接入。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 路由
  go_router: ^14.6.2

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 网络
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3

  # 无边框桌面窗口 + 真透明背景
  window_manager: ^0.5.2

  # 获取屏幕信息(分辨率/缩放比/可用区域等)，计算桌面端窗口初始尺寸
  screen_retriever: ^0.2.2

  # 国际化
  intl: any

  # 打包原生加密库(FFI 调 sgit_crypto)
  ffi: ^2.1.0
  flutter_svg: ^2.3.0

  # 注:Web 端加密**不引任何 Dart 加密库** —— 加载同一份 Rust 编出的 WASM
  # (web/pkg/,见 deploy/build-wasm.sh),与桌面 .so / Windows .dll 三端同源。
  # 绑定层在 lib/core/network/crypto/browser_crypto.dart,只做 js_interop 转发。
  # 文件选择器(桌面/移动端)
  file_picker: ^13.1.0

  # 中文拼音转换(用于名称排序)
  lpinyin: ^2.0.3
dev_dependencies:
  # session_sync_test 用它测去抖时序。虽然是 flutter_test 的传递依赖，
  # 但直接 import 就该直接声明 —— 传递依赖随时可能在上游被摘掉。
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # 品牌资源(随包兜底)。运行时若存在外置目录(SGIT_BRAND_DIR 或 /opt/sgit/bin/brand)
  # 则优先读外置文件,换图不用重编——见 lib/core/brand/brand_assets.dart。
  assets:
    - assets/brand/brand.json
    - assets/brand/images/login/

  # ⚠️ 字体必须随包，且要**拉丁 + 中日韩两份**。
  #
  # Web(CanvasKit)不认系统字体，缺字体时会去 fonts.gstatic.com 拉 Roboto/Noto ——
  # 内网不通 + nginx CSP(font-src 'self')挡死，结果整站文字**全部不渲染**。
  # 桌面端虽有系统字体兜底，这里统一用同一份，保证两端字形一致、行为可预测。
  #
  # 为什么两份:DroidSansFallback 是**纯 CJK 兜底字体，一个拉丁字母都没有**
  # (charset 只有 U+0020/U+0E3F + 汉字/谚文)，单用它英文数字全变豆腐块 ——
  # 验证码字母、用户名、token 会直接看不了。故拉丁交给 DejaVuSans。
  #
  # 许可(要随产品分发，必须可再分发):
  #   · DejaVuSans        Bitstream Vera + Public Domain，740KB
  #   · DroidSansFallback Apache-2.0，3.4MB
  fonts:
    # 主字体:拉丁字母/数字/符号。
    - family: SGiTSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    # 兜底字体:中日韩。由 AppTypography.fontFallback 挂在主字体之后。
    - family: SGiTSansCJK
      fonts:
        - asset: assets/fonts/DroidSansFallback.ttf
    # ⚠️ 别删:这个 `Roboto` 别名是用来**掐断引擎去 gstatic 下载 Roboto** 的。
    # Flutter Web 引擎启动时无条件补一次 Roboto,只有当已注册字体里存在名为 "Roboto"
    # 的家族才跳过(引擎代码:`if (j === "Roboto") m = true; ... if (!m) push(下载 Roboto)`)。
    # 内网拉不到 + CSP connect-src 'self' 会把它拦成一串控制台报错,并连带触发
    # "RenderBox was not laid out"。注册同一份 DejaVu 顶掉即可,不额外增加体积。
    - family: Roboto
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
