name: sgit_nexus
description: "SGiT-Nexus — 全端(Web/桌面/移动)后台总控台，走 sgcode / SGiT-Server 的 API 与数据库。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 路由
  go_router: ^14.6.2

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 网络
  dio: ^5.7.0

  # 本地存储
  shared_preferences: ^2.3.3

  # 无边框桌面窗口 + 真透明背景
  window_manager: ^0.5.2

  # 国际化
  intl: any

  # 打包原生加密库(FFI 调 sgit_crypto)
  ffi: ^2.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
