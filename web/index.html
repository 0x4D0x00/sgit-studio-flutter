<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title></title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 本文件原样发到浏览器:只放运行必需的最少代码,不写任何说明性内容。 -->
  <script type="module">
    import init, {
      sgit_request,
      sgit_login_v2,
      sgit_logout,
      sgit_is_authenticated,
      sgit_validate_session,
      sgit_current_cid,
      sgit_kernel_open,
      sgit_kernel_close,
      sgit_kernel_set_waker,
      sgit_kernel_drain,
      sgit_kernel_caps,
      sgit_kernel_connect_status,
      sgit_kernel_send,
      sgit_kernel_interrupt,
      sgit_kernel_steer,
      sgit_kernel_respond,
      sgit_kernel_set_thread,
      sgit_gateway_call,
    } from './pkg/sgit_ffi_web.js';

    window.__sgitCryptoReady = init().then(() => {
      window.__sgitFfi = {
        request: sgit_request,
        loginV2: sgit_login_v2,
        logout: sgit_logout,
        isAuthenticated: sgit_is_authenticated,
        validateSession: sgit_validate_session,
        currentCid: sgit_current_cid,
      };
      window.__sgitKernel = {
        open: sgit_kernel_open,
        close: sgit_kernel_close,
        setWaker: sgit_kernel_set_waker,
        drain: sgit_kernel_drain,
        caps: sgit_kernel_caps,
        connectStatus: sgit_kernel_connect_status,
        send: sgit_kernel_send,
        interrupt: sgit_kernel_interrupt,
        steer: sgit_kernel_steer,
        respond: sgit_kernel_respond,
        setThread: sgit_kernel_set_thread,
        gatewayCall: sgit_gateway_call,
      };
      return true;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
